plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'java'
    id 'com.gradle.plugin-publish' version "1.2.1"
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = project.hasProperty('artifact_version') ? project.property('artifact_version') : '1.0'
group = artifact_group
description = artifact_description
def main = "${group}.${artifact_id}.Main"

shadowJar {
    archiveClassifier = ''
    archiveFileName = "${artifact_name}-${version}-standalone.jar"
    manifest {
        attributes 'Main-Class': main
    }
    mergeServiceFiles()
    minimize()
}

tasks.build {
    dependsOn shadowJar
}

// The Gradle-free client library: everything a consumer needs to drive io.github.intisy.gradle.github.api
// outside a Gradle build, published separately from the plugin jar. See TestLibraryJarIsIndependent
// and TestOnlyTheApiCallsImpl for the gates this task exists to satisfy.
task libraryJar(type: Jar) {
    archiveBaseName = "${artifact_name}-api"
    archiveClassifier = ''
    from(sourceSets.main.output) {
        include 'io/github/intisy/gradle/github/api/**'
        include 'io/github/intisy/gradle/github/impl/github/GitHub*'
        include 'io/github/intisy/gradle/github/impl/github/GitHubCli*'
        include 'io/github/intisy/gradle/github/impl/github/GitHubSourceBuilds*'
        include 'io/github/intisy/gradle/github/impl/RepositoriesImpl*'
        include 'io/github/intisy/gradle/github/impl/source/SourceBuilder*'
        include 'io/github/intisy/gradle/github/impl/source/BuildInvoker*'
        include 'io/github/intisy/gradle/github/impl/download/UrlDownloads*'
        include 'io/github/intisy/gradle/github/impl/JarResolverImpl*'
        include 'io/github/intisy/gradle/github/utils/FileUtils*'
        include 'io/github/intisy/gradle/github/utils/UrlRedaction*'
        include 'io/github/intisy/gradle/github/utils/UrlDigest*'
        include 'io/github/intisy/gradle/github/utils/CloneUrlIdentity*'
        exclude 'io/github/intisy/gradle/github/Main*'
        exclude 'io/github/intisy/gradle/github/plugin/**'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

gradlePlugin {
    website.set("https://github.com/intisy/$artifact_name")
    vcsUrl.set("https://github.com/intisy/$artifact_name")
    plugins {
        create(artifact_name) {
            id = "$group.$artifact_name"
            implementationClass = main
            displayName = display_name
            description = this.description
            tags = ["github", "dependency", "jar", "jitpack"]
        }
    }
}

repositories {
	mavenCentral()
}

tasks.withType(Javadoc) {
    failOnError true
    title = "$display_name API Documentation"
    classpath = sourceSets.main.runtimeClasspath
    destinationDir = file("$buildDir/docs/javadoc")
    options {
        encoding = 'UTF-8'
        author = true
        version = true
        links("https://docs.oracle.com/en/java/javase/11/docs/api/")
        tags("implNote:a:Implementation Note:", "implSpec:a:Implementation Requirements:")
        addBooleanOption('Xwerror', true)
    }
}

// The single source of truth for libraryJar's runtime dependencies: read by the dependencies
// block below (implementation/api, so the plugin's own compile and test classpath stay in sync
// with what the library jar actually needs) and by the libraryJar publication's pom.withXml, so
// a version bump written here is the only edit either place ever needs.
ext.libraryJarRuntimeDependencies = [
        okhttp:  [group: 'com.squareup.okhttp3', name: 'okhttp',                    version: '4.12.0'],
        gson:    [group: 'com.google.code.gson', name: 'gson',                      version: '2.10.1'],
        jgit:    [group: 'org.eclipse.jgit',     name: 'org.eclipse.jgit',          version: '5.13.3.202401111512-r'],
        jgitSsh: [group: 'org.eclipse.jgit',     name: 'org.eclipse.jgit.ssh.jsch', version: '5.13.3.202401111512-r'],
        jzlib:   [group: 'com.jcraft',           name: 'jzlib',                     version: '1.1.3'],
        jsch:    [group: 'com.github.mwiede',    name: 'jsch',                      version: '2.27.5'],
]

def libraryJarDependencyCoordinate(String key) {
    def dep = libraryJarRuntimeDependencies[key]
    "${dep.group}:${dep.name}:${dep.version}"
}

dependencies {
    implementation gradleApi()

    implementation libraryJarDependencyCoordinate('okhttp')
    implementation libraryJarDependencyCoordinate('gson')

    api libraryJarDependencyCoordinate('jgit')
    api(libraryJarDependencyCoordinate('jgitSsh')) {
        exclude group: 'com.jcraft', module: 'jsch'
        exclude group: 'com.jcraft', module: 'jzlib'
    }

    api libraryJarDependencyCoordinate('jzlib')
    api libraryJarDependencyCoordinate('jsch')

    testImplementation(platform("org.junit:junit-bom:5.9.1"))
    testImplementation "org.junit.jupiter:junit-jupiter"
}

// Guards against the dependencies block and libraryJarRuntimeDependencies ever drifting apart
// again: fails at configuration time (before any task runs) if what implementation/api actually
// declare stops matching what the map (and therefore the published pom) says. gradleApi() has no
// Maven group, so it is not a real coordinate and is excluded from the comparison.
def declaredLibraryJarCoordinates = (configurations.implementation.dependencies + configurations.api.dependencies)
        .findAll { it.group != null }
        .collect { "${it.group}:${it.name}:${it.version}" }
        .toSet()
def publishedLibraryJarCoordinates = libraryJarRuntimeDependencies.values()
        .collect { "${it.group}:${it.name}:${it.version}" }
        .toSet()
if (declaredLibraryJarCoordinates != publishedLibraryJarCoordinates) {
    throw new GradleException("libraryJar's dependencies block and its published pom have drifted apart.\n"
            + "Declared on implementation/api: " + declaredLibraryJarCoordinates + "\n"
            + "Declared in libraryJarRuntimeDependencies: " + publishedLibraryJarCoordinates)
}

task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from tasks.javadoc
}

artifacts {
    archives javadocJar
}

test {
    dependsOn libraryJar
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        stackTraceFilters "entryPoint"
    }
}

publishing {
    publications {
        libraryJar(MavenPublication) {
            groupId = group
            artifactId = "${artifact_name}-api"
            version = project.version
            artifact tasks.named('libraryJar')
            pom {
                name = "${display_name} API"
                description = "Gradle-free client library exposing io.github.intisy.gradle.github.api, backed by the same GitHub REST/git client as the ${display_name} Gradle plugin."
            }
            // libraryJar packages plain class files with no attached component, so its
            // runtime dependencies have to be declared by hand rather than derived from a
            // Gradle component. Read from libraryJarRuntimeDependencies (the same map the
            // dependencies block above builds its coordinates from) so there is exactly one
            // place a version is written. None of these types appear on the api package's own
            // signatures (enforced by TestCapabilityCoverage), so "runtime" is honest: a
            // consumer never needs them on its own compile classpath, only when a GitHubApi
            // call actually runs.
            pom.withXml {
                def dependenciesNode = asNode().appendNode('dependencies')
                libraryJarRuntimeDependencies.values().each { dep ->
                    def dependencyNode = dependenciesNode.appendNode('dependency')
                    dependencyNode.appendNode('groupId', dep.group)
                    dependencyNode.appendNode('artifactId', dep.name)
                    dependencyNode.appendNode('version', dep.version)
                    dependencyNode.appendNode('scope', 'runtime')
                }
            }
        }
    }
}

task createClasspathManifest {
    def outputDir = file("$buildDir/$name")
    inputs.files sourceSets.main.runtimeClasspath
    outputs.dir outputDir
    doLast {
        outputDir.mkdirs()
        file("$outputDir/plugin-classpath.txt").text = sourceSets.main.runtimeClasspath.join("\n")
    }
}
